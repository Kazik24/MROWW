name: Test

on:
  push:
    branches: [master, piston, 'port/**']
  pull_request:
    branches: [master, 'port/**']

env:
  CARGO_TERM_COLOR: always
  MCHPRS_LLVM_CLANG: /usr/bin/clang-19
  MCHPRS_LLVM_LINKER: /usr/bin/ld.lld-19
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native compiler
        run: |
          sudo apt-get update && sudo apt-get install -y clang-19 lld-19
          "$MCHPRS_LLVM_CLANG" --version
          "$MCHPRS_LLVM_LINKER" --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Library and API tests
        run: |
          cargo test --locked --lib -p mchprs_blocks -p mchprs_utils -p mchprs_network -p mchprs_save_data -p mroww-redgear-api
          cargo test --locked -p mroww-redgear-api --test session
          cargo test --locked -p mchprs_core --test headless_api
      - name: Server and plot regression tests
        run: |
          cargo test --locked -p mchprs_core --lib -- server::
          cargo test --locked -p mchprs_core --lib -- plot::client_sync_tests::
          cargo test --locked -p mchprs_core --lib -- plot::history::
          cargo test --locked -p mchprs_core --lib -- plot::piston_tests::
          cargo test --locked -p mchprs_core --lib -- plot::command_block_tests::
          cargo test --locked -p mchprs_core --lib -- plot::redpilator_compilation::
      - name: Redpilator and scratch regressions
        run: |
          # Existing fixture, oracle, and executor-cache exclusions.
          cargo test --locked -p mchprs_core --lib -- redpilator:: \
            --skip adder11bit_reference_manifest_acceptance \
            --skip adder1bit_reference_manifest_arithmetic \
            --skip counter_basic_reference_manifest_execution \
            --skip focused_test_samples_match_supported_oracles \
            --skip redstonedb_levers_match_interpreter \
            --skip executor_cache_resumes_pending_motion_and_effects_like_uninterrupted_execution
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated registry binaries
        run: |
          python tools/generate_mc_data.py
          git diff --exit-code -- mc_data/1.21.5/registries.bin mc_data/1.21.5/tags.bin
